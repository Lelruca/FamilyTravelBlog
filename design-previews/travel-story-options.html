<style>
#family-travel-design .ft-page{--ft-paper:light-dark(#faf8f4,#242321);--ft-ink:light-dark(#252722,#f4f0e8);background:var(--ft-paper);color:var(--ft-ink);margin-top:16px;padding:26px 30px 32px;font-family:Arial,sans-serif}

#family-travel-design .ft-top span{letter-spacing:0;opacity:.65}

#family-travel-design img{display:block;width:100%;height:auto}

#family-travel-design .ft-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;align-items:start}
#family-travel-design .ft-split{display:grid;grid-template-columns:1fr 1.35fr;gap:24px;align-items:center;margin-bottom:20px}
#family-travel-design .ft-split p{font-family:Georgia,serif;font-size:25px;line-height:1.5;margin:0}
#family-travel-design .ft-cover{position:relative;margin-top:10px;color:#fff;background:#252722}
#family-travel-design .ft-cover img{height:420px;object-fit:cover}
#family-travel-design .ft-cover>div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:end;padding:30px;background:linear-gradient(transparent 15%,rgba(0,0,0,.8))}
#family-travel-design .ft-cover p{font-size:19px;line-height:1.5;max-width:400px;margin:16px 0 0}
@media(max-width:480px){#family-travel-design .ft-page{padding:20px 16px}#family-travel-design .ft-split{grid-template-columns:1fr}#family-travel-design .ft-split p{font-size:22px}#family-travel-design h2{font-size:42px}#family-travel-design .ft-cover>div{padding:20px}}
</style>
