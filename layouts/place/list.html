{{ define "main" }}
<link rel="stylesheet" href="{{ "css/places.css" | relURL }}">
<div id="place-explorer" class="max-w-5xl mx-auto px-4 py-12">

  <header><h1 class="font-serif text-4xl font-bold">{{ .Title }}</h1><p class="place-context">Главы об этом месте</p></header>
  {{ partial "place-chapters.html" . }}

</div>
{{ end }}
