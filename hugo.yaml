baseURL: "/"
languageCode: "ru"
title: "Наши путешествия"

# Taxonomy: time navigation (Geography uses sections natively)
taxonomies:
  place: "places"

# Image processing
imaging:
  quality: 85
  resampleFilter: "Lanczos"
  anchor: "Smart"

# Allow raw HTML in markdown
markup:
  goldmark:
    extensions:
      typographer:
        disable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Hugo build stats (used by Tailwind PurgeCSS in production)
build:
  writeStats: true

# Site params
params:
  defaultAccent: "#4f7396"
  # Screen-quality photo copies (layout photo-story). Locally: static/r2. On the published site: Cloudflare R2 (hugo.prod.yaml).
  photoBase: "r2/"
  giscusRepo: ""
  giscusRepoId: ""
  giscusCategory: ""
  giscusCategoryId: ""

# Auto-set type: "trips" on all pages that are 3+ levels deep
# (continent/country/trip/chapter) so they use layouts/trips/
cascade:
  - target:
      path: "{/europe,/asia,/americas,/africa,/oceania,/australia}/*/*/**"
    type: "trips"
  - target:
      path: "{/europe,/asia,/americas,/africa,/oceania,/australia}/*/**"
      kind: "section"
    type: "trips"
